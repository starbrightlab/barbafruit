apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.family.barbafruit'
    // compileSdk 33 is required by current AndroidX libs; min/target stay locked at 28
    // so no API > 28 behavior is ever requested on the Portal's Android 9 OS.
    compileSdk 33

    defaultConfig {
        applicationId "com.family.barbafruit"
        minSdk 28
        targetSdk 28
        versionCode 2
        versionName "2.0"
    }

    signingConfigs {
        // A keystore committed to the repo (debug-grade secret, it only signs
        // this family game): every build anywhere — local or CI — carries the
        // same signature, so release updates install over each other without
        // an uninstall.
        debug {
            storeFile file("${rootDir}/keystore/barbafruit.keystore")
            storePassword 'barbafruit'
            keyAlias 'barbafruit'
            keyPassword 'barbafruit'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // Per-ABI APKs alongside the universal one: the Portal (Snapdragon 625)
    // only needs ARM, and the slim APKs are far easier to shuttle around.
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.1.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // CameraX — last line fully validated on API 28 hardware
    def camerax_version = '1.2.3'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"

    // ML Kit on-device Face Detection (bundled model — no Play Services download
    // needed, which matters on Portal devices without full GMS)
    implementation 'com.google.mlkit:face-detection:16.1.5'
}

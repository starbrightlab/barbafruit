name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lintVitalRelease

      - name: Name APKs after the tag
        run: |
          cd app/build/outputs/apk/release
          mv app-arm64-v8a-release.apk   "Barbafruit-${GITHUB_REF_NAME}-arm64.apk"
          mv app-armeabi-v7a-release.apk "Barbafruit-${GITHUB_REF_NAME}-arm32.apk"
          mv app-universal-release.apk   "Barbafruit-${GITHUB_REF_NAME}-universal.apk"

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/Barbafruit-*.apk
          generate_release_notes: true

      - name: Upload APKs as workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: barbafruit-apks
          path: app/build/outputs/apk/release/Barbafruit-*.apk

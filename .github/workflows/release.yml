name: Release APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create at this commit (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -x lintVitalRelease

      - name: Name APKs after the tag
        run: |
          cd app/build/outputs/apk/release
          mv app-arm64-v8a-release.apk   "Barbafruit-${TAG}-arm64.apk"
          mv app-armeabi-v7a-release.apk "Barbafruit-${TAG}-arm32.apk"
          mv app-universal-release.apk   "Barbafruit-${TAG}-universal.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: app/build/outputs/apk/release/Barbafruit-*.apk
          generate_release_notes: true
